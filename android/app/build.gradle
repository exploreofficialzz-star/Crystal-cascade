plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) { flutterVersionCode = '1' }

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) { flutterVersionName = '1.0' }

android {
    namespace "com.chastechgroup.crystalcascade"
    compileSdkVersion 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = '17' }

    sourceSets { main.java.srcDirs += 'src/main/kotlin' }

    defaultConfig {
        applicationId "com.chastechgroup.crystalcascade"
        minSdkVersion 21
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    signingConfigs {
        release {
            def envKeystorePath     = System.getenv("KEYSTORE_PATH")
            def envKeystorePassword = System.getenv("KEYSTORE_PASSWORD")
            def envKeyAlias         = System.getenv("KEY_ALIAS")
            def envKeyPassword      = System.getenv("KEY_PASSWORD")

            if (envKeystorePath && envKeystorePassword && envKeyAlias && envKeyPassword) {
                storeFile     = file("${rootProject.projectDir}/app/${envKeystorePath}")
                storePassword = envKeystorePassword
                keyAlias      = envKeyAlias
                keyPassword   = envKeyPassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug { signingConfig signingConfigs.debug }
    }

    flavorDimensions "default"
    productFlavors {
        production {
            dimension "default"
            resValue "string", "app_name", "Crystal Cascade"
        }
        development {
            dimension "default"
            applicationIdSuffix ".dev"
            resValue "string", "app_name", "Crystal Cascade Dev"
        }
    }

    // ── Globally exclude the deprecated monolithic play:core.
    //    The new split libraries (app-update, review) replace it fully
    //    and are compatible with targetSdkVersion 36.
    //
    // ── Force Google Play Billing Library 8.0.0 (Play Console requirement,
    //    effective August 31 2026) regardless of what the flutter in_app_purchase
    //    plugin or any transitive dependency requests.
    configurations.all {
        exclude group: 'com.google.android.play', module: 'core'
        exclude group: 'com.google.android.play', module: 'core-ktx'
        resolutionStrategy {
            force 'com.android.billingclient:billing:8.0.0'
            force 'com.android.billingclient:billing-ktx:8.0.0'
        }
    }
}

flutter { source '../..' }

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.0"
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'

    // SDK-34/35-compatible Play Core split libraries.
    // Non-KTX only — avoids duplicate class conflict with core-ktx.
    implementation 'com.google.android.play:app-update:2.1.0'
    implementation 'com.google.android.play:review:2.0.1'
}
