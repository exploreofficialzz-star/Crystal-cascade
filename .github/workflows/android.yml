name: Android CI/CD Build
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze project
        run: flutter analyze --no-fatal-infos
      - name: Run tests
        run: flutter test
      - name: Decode Keystore
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release-key.jks
      - name: Build APK (universal — works on all Android devices)
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_PATH: release-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release --flavor production
      - name: Build App Bundle (AAB)
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_PATH: release-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build appbundle --release --flavor production
      - name: Remove decoded keystore
        if: always()
        run: rm -f android/app/release-key.jks
      - name: Upload APK Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
      - name: Upload AAB Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: android-app-bundle
          path: build/app/outputs/bundle/productionRelease/*.aab
          retention-days: 30
      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/productionRelease/*.aab
          tag_name: v${{ github.run_number }}
          name: Crystal Cascade v${{ github.run_number }}
          body: |
            ## Crystal Cascade — Android Release v${{ github.run_number }}
            ### Downloads
            - **APK** — Universal, installs directly on any Android phone (arm64, armv7, x86_64 all in one file)
            - **AAB** — Upload this to Google Play Store
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
