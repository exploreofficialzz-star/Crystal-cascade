name: Android CI/CD Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.6-stable"
  GODOT_TEMPLATES_VERSION: "4.6.stable"
  ADMOB_VERSION: "v6.0"
  BILLING_VERSION: "3.3.0"
  NOTIFICATIONS_VERSION: "v5.2"
  # Bundles the AdMob and Google Play Billing plugins into the app. Keep "true"
  # for production. (If a plugin ever breaks the build, set "false" to ship
  # without ads/purchases while you investigate.)
  ENABLE_MONETIZATION_PLUGINS: "true"
  # Local reminder notifications (lives full, daily reward, streak, come-back).
  # Ships OFF until you have confirmed that the game launches on a phone with
  # this build. Then set it to "true", push, and test again. The game works
  # fully without it (it simply sends no reminders).
  ENABLE_NOTIFICATION_PLUGIN: "false"
  # The two script gates below stop a build whose scripts do not compile (such a
  # build would close right after the splash screen). Set "true" only if a gate
  # ever blocks a build for a wrong reason.
  SKIP_SCRIPT_GATES: "false"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 platforms;android-36 build-tools;35.0.0 build-tools;36.0.0 ndk;28.1.13356709'
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        run: |
          command -v sdkmanager
          sdkmanager --list >/dev/null

      - name: Install Godot 4.6
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v${GODOT_VERSION}_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo mv "/tmp/godot/Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --version

      - name: Install matching Godot export templates
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_export_templates.tpz" -O /tmp/export_templates.tpz
          rm -rf /tmp/export_templates
          mkdir -p /tmp/export_templates
          unzip -q /tmp/export_templates.tpz -d /tmp/export_templates
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATES_VERSION}"
          rm -rf "$TEMPLATE_DIR"
          mkdir -p "$TEMPLATE_DIR"
          unzip -q -j /tmp/export_templates.tpz \
            'templates/android_source.zip' \
            'templates/android_release.apk' \
            'templates/android_debug.apk' \
            'templates/version.txt' \
            -d "$TEMPLATE_DIR"
          test -f "$TEMPLATE_DIR/android_source.zip"
          test -f "$TEMPLATE_DIR/android_release.apk"
          test -f "$TEMPLATE_DIR/android_debug.apk"
          test -f "$TEMPLATE_DIR/version.txt"
          test "$(cat "$TEMPLATE_DIR/version.txt")" = "$GODOT_TEMPLATES_VERSION"
          ls -lh "$TEMPLATE_DIR"

      - name: Configure Godot Android paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "/usr/local/lib/android/sdk"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOF
          cat "$HOME/.config/godot/editor_settings-4.tres"

      - name: Hide the Android system splash icon (only the game logo splash remains)
        continue-on-error: true
        run: |
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATES_VERSION}"
          python3 - "$TEMPLATE_DIR/android_source.zip" <<'PY'
          import os, re, shutil, sys, zipfile
          src = sys.argv[1]
          tmp = src + ".patched"
          navy = "#FF090A1A"
          changed = 0
          with zipfile.ZipFile(src) as zin, zipfile.ZipFile(tmp, "w", zipfile.ZIP_DEFLATED) as zout:
              for item in zin.infolist():
                  data = zin.read(item.filename)
                  if re.search(r"res/values[^/]*/(themes|styles)\.xml$", item.filename):
                      text = data.decode("utf-8")
                      new = re.sub(r'(<item\s+name="(?:android:)?windowSplashScreenBackground"\s*>)[^<]*(</item>)',
                                   r'\g<1>' + navy + r'\g<2>', text)
                      new = re.sub(r'(<item\s+name="(?:android:)?windowSplashScreenAnimatedIcon"\s*>)[^<]*(</item>)',
                                   r'\g<1>@android:color/transparent\g<2>', new)
                      if new != text:
                          changed += 1
                          data = new.encode("utf-8")
                  zout.writestr(item, data)
          if changed:
              shutil.move(tmp, src)
          else:
              os.remove(tmp)
          print("splash theme files patched:", changed)
          PY

      - name: Install AdMob plugin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/admob
          mkdir -p /tmp/admob
          gh release download "$ADMOB_VERSION" --repo godot-sdk-integrations/godot-admob --dir /tmp/admob --pattern '*.zip'
          ADMOB_ZIP=$(find /tmp/admob -type f -name '*.zip' | head -1)
          test -n "$ADMOB_ZIP"
          rm -rf /tmp/admob/unpacked
          mkdir -p /tmp/admob/unpacked
          unzip -q "$ADMOB_ZIP" -d /tmp/admob/unpacked
          rm -rf addons/AdmobPlugin
          mkdir -p addons
          AD_DIR=$(find /tmp/admob/unpacked -type d -name 'AdmobPlugin' | head -1)
          test -n "$AD_DIR"
          cp -R "$AD_DIR" addons/AdmobPlugin
          cat > addons/AdmobPlugin/android_export.cfg <<'CFG'
          [General]
          is_real = true

          [Debug]
          app_id = "ca-app-pub-3940256099942544~3347511713"

          [Release]
          app_id = "ca-app-pub-2492078126313994~1061290053"
          CFG

      - name: Install Google Play Billing plugin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/billing
          mkdir -p /tmp/billing
          gh release download "$BILLING_VERSION" --repo godot-sdk-integrations/godot-google-play-billing --dir /tmp/billing --pattern '*.zip'
          BILLING_ZIP=$(find /tmp/billing -type f -name '*.zip' | head -1)
          test -n "$BILLING_ZIP"
          rm -rf /tmp/billing/unpacked
          mkdir -p /tmp/billing/unpacked
          unzip -q "$BILLING_ZIP" -d /tmp/billing/unpacked
          BILLING_DIR=$(find /tmp/billing/unpacked -type d -name 'GodotGooglePlayBilling' | head -1)
          test -n "$BILLING_DIR"
          rm -rf addons/GodotGooglePlayBilling
          cp -R "$BILLING_DIR" addons/GodotGooglePlayBilling

      - name: Install Notification Scheduler plugin (reminders)
        if: env.ENABLE_NOTIFICATION_PLUGIN == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/notif
          mkdir -p /tmp/notif
          for REPO in godot-mobile-plugins/godot-notification-scheduler godot-sdk-integrations/godot-notification-scheduler; do
            gh release download "$NOTIFICATIONS_VERSION" --repo "$REPO" --dir /tmp/notif --pattern '*Android*.zip' && break
            gh release download "$NOTIFICATIONS_VERSION" --repo "$REPO" --dir /tmp/notif --pattern '*.zip' && break
          done
          NOTIF_ZIP=$(find /tmp/notif -type f -name '*.zip' | head -1)
          test -n "$NOTIF_ZIP"
          rm -rf /tmp/notif/unpacked
          mkdir -p /tmp/notif/unpacked
          unzip -q "$NOTIF_ZIP" -d /tmp/notif/unpacked
          NOTIF_DIR=$(find /tmp/notif/unpacked -type d -path '*addons/NotificationSchedulerPlugin' | head -1)
          test -n "$NOTIF_DIR"
          rm -rf addons/NotificationSchedulerPlugin
          mkdir -p addons
          cp -R "$NOTIF_DIR" addons/NotificationSchedulerPlugin
          NOTIF_ASSETS=$(find /tmp/notif/unpacked -type d -path '*assets/NotificationSchedulerPlugin' | head -1)
          if [ -n "$NOTIF_ASSETS" ]; then
            rm -rf assets/NotificationSchedulerPlugin
            mkdir -p assets
            cp -R "$NOTIF_ASSETS" assets/NotificationSchedulerPlugin
          fi
          test -f addons/NotificationSchedulerPlugin/plugin.cfg
          echo "Notification Scheduler plugin installed"

      - name: Enable monetization plugins
        if: env.ENABLE_MONETIZATION_PLUGINS == 'true'
        run: |
          test -f addons/AdmobPlugin/plugin.cfg
          test -f addons/GodotGooglePlayBilling/plugin.cfg
          PLUGINS='"res://addons/AdmobPlugin/plugin.cfg", "res://addons/GodotGooglePlayBilling/plugin.cfg"'
          if [ -f addons/NotificationSchedulerPlugin/plugin.cfg ]; then
            PLUGINS="$PLUGINS, \"res://addons/NotificationSchedulerPlugin/plugin.cfg\""
          fi
          printf '\n[editor_plugins]\n\nenabled=PackedStringArray(%s)\n' "$PLUGINS" >> project.godot
          tail -5 project.godot

      - name: Import and validate Godot project
        run: |
          godot --headless --editor --path . --quit-after 10

      - name: Script check (fails the build if any script cannot compile)
        if: env.SKIP_SCRIPT_GATES != 'true'
        run: |
          set +e
          FAIL=0
          for f in $(find scripts config -name '*.gd' | sort); do
            OUT=$(godot --headless --path . --check-only --script "res://$f" 2>&1)
            if echo "$OUT" | grep -E -q "Parse Error|Compile Error"; then
              echo "::error file=$f::This script does not compile"
              echo "$OUT" | grep -E -B1 -A3 "Parse Error|Compile Error" | head -30
              FAIL=1
            fi
          done
          exit $FAIL

      - name: Boot test (runs the game headless, fails the build if it cannot start)
        if: env.SKIP_SCRIPT_GATES != 'true'
        run: |
          set +e
          timeout 240 godot --headless --path . --fixed-fps 30 --quit-after 450 > /tmp/boot.log 2>&1
          echo "godot exit code: $?"
          if grep -E -q "Parse Error|Compile Error" /tmp/boot.log; then
            echo "::error::The game cannot start because a script has an error"
            grep -E -B2 -A4 "Parse Error|Compile Error" /tmp/boot.log | head -80
            exit 1
          fi
          if grep -q "SCRIPT ERROR" /tmp/boot.log; then
            echo "::warning::Runtime script errors were logged during the headless boot"
            grep -B1 -A4 "SCRIPT ERROR" /tmp/boot.log | head -100
          fi
          echo "Boot test finished without compile errors"

      - name: Decode release keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/crystal-cascade-release.jks
          chmod 600 /tmp/crystal-cascade-release.jks
          keytool -list -keystore /tmp/crystal-cascade-release.jks -storepass "${{ secrets.KEYSTORE_PASSWORD }}" -alias "${{ secrets.KEY_ALIAS }}" >/dev/null

      - name: Build signed APK (test ads) and AAB (real ads)
        if: github.event_name != 'pull_request'
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /tmp/crystal-cascade-release.jks
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          GODOT_ANDROID_KEYSTORE_RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p build
          # 1) APK for testing on your own phone: Google TEST ads only, so you
          #    can tap ads safely (tapping real ads on your own device can get
          #    the AdMob account suspended).
          grep -q "const USE_REAL_ADS := false" config/production.gd
          godot --headless --path . --install-android-build-template --export-release "Android APK" build/CrystalCascade.apk
          # 2) AAB for Google Play: switch to your REAL ad units.
          sed -i 's/const USE_REAL_ADS := false/const USE_REAL_ADS := true/' config/production.gd
          grep -q "const USE_REAL_ADS := true" config/production.gd
          godot --headless --path . --export-release "Android AAB" build/CrystalCascade.aab
          test -s build/CrystalCascade.apk
          test -s build/CrystalCascade.aab

      - name: Show permissions declared by the final app (for the Play Console forms)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          AAPT2=$(ls "$SDK"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$AAPT2" ]; then
            "$AAPT2" dump permissions build/CrystalCascade.apk || true
          fi

      - name: Remove decoded keystore
        if: always()
        run: rm -f /tmp/crystal-cascade-release.jks

      - name: Upload APK artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: crystal-cascade-apk
          path: build/CrystalCascade.apk
          retention-days: 30

      - name: Upload AAB artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: crystal-cascade-aab
          path: build/CrystalCascade.aab
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/CrystalCascade.apk
            build/CrystalCascade.aab
          tag_name: v${{ github.run_number }}
          name: Crystal Cascade v${{ github.run_number }}
          generate_release_notes: true
          body: |
            ## Crystal Cascade — Android release v${{ github.run_number }}

            - APK: direct Android testing/install (Google TEST ads).
            - AAB: Google Play Console upload (REAL ads).
            - Signed with the repository's release keystore secrets.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
