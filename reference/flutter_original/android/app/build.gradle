plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) { flutterVersionCode = '1' }

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) { flutterVersionName = '1.0' }

android {
    namespace "com.chastechgroup.crystalcascade"
    compileSdkVersion 36
    // Hard-pin NDK: flutter.ndkVersion resolves to 23.1.7779620 (bundled with
    // the Flutter SDK), but audioplayers, google_mobile_ads, in_app_purchase,
    // connectivity_plus, flutter_local_notifications, path_provider, and
    // shared_preferences all require NDK 25.1.8937393. NDK versions are
    // backward compatible, so 25 can build targets that needed 23.
    ndkVersion "25.1.8937393"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = '17' }

    sourceSets { main.java.srcDirs += 'src/main/kotlin' }

    defaultConfig {
        applicationId "com.chastechgroup.crystalcascade"
        minSdkVersion 21
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    signingConfigs {
        release {
            def envKeystorePath     = System.getenv("KEYSTORE_PATH")
            def envKeystorePassword = System.getenv("KEYSTORE_PASSWORD")
            def envKeyAlias         = System.getenv("KEY_ALIAS")
            def envKeyPassword      = System.getenv("KEY_PASSWORD")

            // Only configure release signing if ALL four env vars are present.
            // Missing any one will produce an unsigned APK rather than a
            // signing error, which is the safer CI fallback.
            if (envKeystorePath && envKeystorePassword && envKeyAlias && envKeyPassword) {
                storeFile     = file("${rootProject.projectDir}/app/${envKeystorePath}")
                storePassword = envKeystorePassword
                keyAlias      = envKeyAlias
                keyPassword   = envKeyPassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug { signingConfig signingConfigs.debug }
    }

    flavorDimensions "default"
    productFlavors {
        production {
            dimension "default"
            resValue "string", "app_name", "Crystal Cascade"
        }
        development {
            dimension "default"
            applicationIdSuffix ".dev"
            resValue "string", "app_name", "Crystal Cascade Dev"
        }
    }

    // ── Globally exclude the deprecated monolithic play:core.
    //    The new split libraries (app-update, review) replace it fully
    //    and are compatible with targetSdkVersion 36.
    //
    // ── Force Google Play Billing Library 8.0.0 (Play Console requirement,
    //    effective August 31 2026) regardless of what the flutter in_app_purchase
    //    plugin or any transitive dependency requests.
    //
    //    IMPORTANT: Ensure the in_app_purchase pub package version you resolve
    //    via `flutter pub get` is compatible with billing 8.0.0 at runtime.
    //    Run `flutter pub upgrade in_app_purchase` to get the latest 3.x which
    //    includes the billing 8.0 support from the Flutter team.
    configurations.all {
        exclude group: 'com.google.android.play', module: 'core'
        exclude group: 'com.google.android.play', module: 'core-ktx'
        resolutionStrategy {
            force 'com.android.billingclient:billing:8.0.0'
            force 'com.android.billingclient:billing-ktx:8.0.0'
        }
    }
}

flutter { source '../..' }

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    // Kotlin stdlib: version must match the kotlin-android plugin version in
    // settings.gradle (currently 2.1.0). kotlin-stdlib-jdk8 is merged into
    // the main stdlib since Kotlin 1.8, so only one artifact is needed.
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.1.0"

    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'

    // Play Billing Library 8.0.0 — explicit dep so Gradle downloads the
    // correct POM before the resolutionStrategy force applies. The in_app_purchase
    // Flutter plugin brings this in transitively; the force above pins its version.
    implementation 'com.android.billingclient:billing:8.0.0'
    implementation 'com.android.billingclient:billing-ktx:8.0.0'

    // SDK-34/35-compatible Play Core split libraries.
    // Non-KTX only — avoids duplicate class conflict with core-ktx.
    implementation 'com.google.android.play:app-update:2.1.0'
    implementation 'com.google.android.play:review:2.0.1'
}
