# AndroidX — required by audioplayers, google_mobile_ads, and Flutter embedding.
# Without this the build fails with "useAndroidX property is not enabled".
android.useAndroidX=true

# Jetifier migrates any legacy Support Library dependencies to AndroidX automatically.
android.enableJetifier=true

# Gradle JVM memory — prevents OOM on large builds in CI
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError

# Parallel builds
org.gradle.parallel=true
org.gradle.caching=true

# Kotlin code style
kotlin.code.style=official
